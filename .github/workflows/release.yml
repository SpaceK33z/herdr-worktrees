name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check tag version
        shell: bash
        run: |
          package_version=$(awk '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^version = / { gsub(/["[:space:]]/, "", $3); print $3; exit }
          ' Cargo.toml)
          plugin_version=$(awk '/^version = /{gsub(/["[:space:]]/, "", $3); print; exit}' herdr-plugin.toml)
          test "$GITHUB_REF_NAME" = "v$package_version"
          test "$package_version" = "$plugin_version" || {
            echo "Cargo.toml ($package_version) and herdr-plugin.toml ($plugin_version) disagree" >&2
            exit 1
          }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: cargo package --locked
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
