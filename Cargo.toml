[package]
name = "herdr-worktrees"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "Switch, create, and remove git worktrees from a Herdr popup"
license = "MIT"
authors = ["Kees Kluskens"]
repository = "https://github.com/SpaceK33z/herdr-worktrees"
homepage = "https://github.com/SpaceK33z/herdr-worktrees"
keywords = ["herdr", "git", "worktree", "tui", "fzf"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "herdr-worktrees"
path = "src/main.rs"

[lib]
name = "herdr_worktrees"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
indicatif = "0.18.6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
